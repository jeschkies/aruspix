name: Release

on:
  push:
    tags: ["v*"]

jobs:
  # Calls build.yml's build/package logic rather than duplicating the
  # ~300-line multi-platform matrix here. github.ref/github.ref_name
  # inside the called workflow reflect this same tag push, so its
  # "Compute package version" step names the packages after the tag
  # (e.g. Aruspix_v0.0.1.exe) without any extra wiring.
  package:
    uses: ./.github/workflows/build.yml

  publish:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --repo "${{ github.repository }}" \
            --title "${{ github.ref_name }}" \
            --generate-notes \
            dist/aruspix-installer-*/Aruspix_*.exe \
            dist/aruspix-AppImage-*/Aruspix_*.AppImage \
            dist/aruspix-app-*/Aruspix_*.zip
