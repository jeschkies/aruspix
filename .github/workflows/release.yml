name: Release

on:
  push:
    tags: ["v*"]

jobs:
  # Calls build.yml's build/package logic rather than duplicating the
  # ~300-line multi-platform matrix here. github.ref/github.ref_name
  # inside the called workflow reflect this same tag push, so its
  # "Compute package version" step names the packages after the tag
  # (e.g. Aruspix_v0.0.1.exe) without any extra wiring.
  package:
    # build.yml's nested comment-artifacts job requests issues/pull-requests
    # write (only actually used on pull_request runs); reusable-workflow
    # calls validate every nested job's permission request statically, so
    # without granting it here this tag-triggered call fails at startup
    # even though comment-artifacts never runs for a tag push.
    permissions:
      contents: read
      issues: write
      pull-requests: write
    uses: ./.github/workflows/build.yml

  publish:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/aruspix-installer-*/Aruspix_*.exe
            dist/aruspix-AppImage-*/Aruspix_*.AppImage
            dist/aruspix-app-*/Aruspix_*.zip
