name: Linux

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # wxWidgets, X11, OpenGL, and uuid are system libraries on Linux —
      # Conan won't pull these for us. Everything else comes from Conan.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libgtk-3-dev \
            libgl1-mesa-dev \
            libglu1-mesa-dev \
            libuuid1 uuid-dev

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Conan
        run: pip install --upgrade "conan>=2.0,<3"

      - name: Detect Conan profile
        run: conan profile detect --force

      - name: Cache Conan packages
        uses: actions/cache@v4
        with:
          path: ~/.conan2
          key: conan-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('conanfile.py', 'recipes/**/conanfile.py') }}
          restore-keys: |
            conan-${{ runner.os }}-${{ runner.arch }}-

      - name: Export local IM recipe
        run: conan export recipes/im

      - name: Install dependencies
        run: conan install . --build=missing

      - name: Configure
        run: cmake --preset conan-release

      - name: Build
        run: cmake --build build/Release -j

      - name: Verify binary
        run: |
          file build/Release/aruspix
          build/Release/aruspix --help || true

      - uses: actions/upload-artifact@v4
        with:
          name: aruspix-linux-${{ runner.arch }}
          path: build/Release/aruspix
          if-no-files-found: error
          retention-days: 14
