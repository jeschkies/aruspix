name: Build

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      # uuid is the only system library Aruspix links directly that Conan
      # doesn't see. Everything else (GTK, X11, xcb, OpenGL, ...) is
      # listed by Conan's wxwidgets/xorg/egl/opengl recipes; we let Conan
      # apt-install those itself further down via the
      # tools.system.package_manager:mode=install conf.
      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y uuid-dev

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Conan
        run: pip install --upgrade "conan>=2.0,<3"

      # Cache Conan downloads + binary packages. Key on the recipe files
      # so a change to the IM recipe or project requirements triggers a
      # rebuild; everyday source edits reuse cached binaries.
      #
      # Restore the cache BEFORE running `conan profile detect` and
      # writing global.conf, so the restore can't clobber a fresh profile
      # that matches this runner or the download-urls setting below.
      - name: Cache Conan packages
        uses: actions/cache@v4
        with:
          path: ~/.conan2
          key: conan-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('conanfile.py', 'recipes/**/conanfile.py') }}
          restore-keys: |
            conan-${{ runner.os }}-${{ runner.arch }}-

      - name: Detect Conan profile
        run: conan profile detect --force

      # core.sources:download_urls falls back to Conan Center's backup
      # source mirror when a recipe's origin URL is unreachable. Matters
      # for chronically flaky upstreams like tukaani.org (xz). The
      # "origin" sentinel means "the URL declared in the recipe" — we
      # try the mirror first, then origin as a final fallback.
      #
      # core.* config has to live in global.conf; it can't be passed as
      # `-c core.sources:...` on the command line (Conan rejects it).
      # Idempotent append (grep -qxF) so re-runs on a warm cache don't
      # accumulate duplicate lines.
      - name: Configure Conan backup sources
        shell: bash
        run: |
          mkdir -p ~/.conan2
          LINE='core.sources:download_urls=["https://c3i.jfrog.io/artifactory/conan-center-backup-sources/", "origin"]'
          touch ~/.conan2/global.conf
          grep -qxF "$LINE" ~/.conan2/global.conf || echo "$LINE" >> ~/.conan2/global.conf

      # MSVC needs vcvars sourced before cl.exe is callable; the action
      # below makes it available to subsequent steps.
      - name: Set up MSVC (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Compute build parallelism
        id: jobs
        # 2x the logical CPU count, applied to both Conan's tools.build:jobs
        # (controls compiles inside dependency builds) and to cmake --build -j
        # for our own targets. getconf works on Linux/macOS; Windows runners
        # have NUMBER_OF_PROCESSORS in the environment.
        run: |
          if command -v getconf >/dev/null 2>&1; then
            cores=$(getconf _NPROCESSORS_ONLN)
          else
            cores=${NUMBER_OF_PROCESSORS:-4}
          fi
          echo "n=$((cores * 2))" >> "$GITHUB_OUTPUT"
        shell: bash

      - name: Install dependencies
        # On Linux, several Conan recipes (xorg, egl, opengl, ...) expect
        # apt-installed system packages. Switching the package manager
        # mode from `check` to `install` lets Conan run apt-get itself
        # so we don't have to keep our own list in sync with the recipes.
        # Force Ninja everywhere so the same `conan-release` preset name
        # works on all platforms (Conan defaults to the Visual Studio
        # multi-config generator on Windows otherwise).
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            conan install . --build=missing \
              -c tools.build:jobs=${{ steps.jobs.outputs.n }} \
              -c tools.cmake.cmaketoolchain:generator=Ninja \
              -c tools.system.package_manager:mode=install \
              -c tools.system.package_manager:sudo=True
          else
            conan install . --build=missing \
              -c tools.build:jobs=${{ steps.jobs.outputs.n }} \
              -c tools.cmake.cmaketoolchain:generator=Ninja
          fi
        shell: bash

      # On Windows, source Conan's generated conanbuild.bat before cmake.
      # It applies vcvars for the arch Conan actually built the deps with,
      # so an ambient x86 shell can't quietly downgrade the aruspix target
      # to Win32 and produce an x86/x64 link mismatch.
      - name: Configure
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            cmd //c "build\\Release\\generators\\conanbuild.bat && cmake --preset conan-release"
          else
            cmake --preset conan-release
          fi

      - name: Build
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            cmd //c "build\\Release\\generators\\conanbuild.bat && cmake --build build/Release -j ${{ steps.jobs.outputs.n }}"
          else
            cmake --build build/Release -j ${{ steps.jobs.outputs.n }}
          fi

      - name: Inspect binary
        # Just confirm the architecture/format. Don't try to run it: as
        # a wxWidgets GUI app it hangs on the headless runner waiting
        # for a display.
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            ls -lh build/Release/aruspix.exe
          elif [ "$RUNNER_OS" = "macOS" ]; then
            file build/Release/Aruspix.app/Contents/MacOS/aruspix
          else
            file build/Release/aruspix
          fi

      # macOS's MACOSX_BUNDLE target has no loose build/Release/aruspix
      # binary to speak of (see below); the .app bundle zip is its only
      # artifact.
      - uses: actions/upload-artifact@v4
        if: runner.os != 'macOS'
        with:
          name: aruspix-${{ runner.os }}-${{ runner.arch }}
          path: |
            build/Release/aruspix*
            !build/Release/Aruspix-*.exe
          if-no-files-found: error
          retention-days: 14

      # windows-latest doesn't ship NSIS; Chocolatey does ship on the
      # runner, so use it to install makensis and put it on PATH for
      # the cpack step below.
      - name: Install NSIS (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          choco install nsis -y --no-progress
          echo "C:/Program Files (x86)/NSIS" >> "$GITHUB_PATH"

      - name: Package installer (Windows)
        if: runner.os == 'Windows'
        shell: bash
        working-directory: build/Release
        run: cpack -C Release

      - name: Upload installer (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: aruspix-installer-${{ runner.os }}-${{ runner.arch }}
          path: build/Release/Aruspix-*.exe
          if-no-files-found: error
          retention-days: 14

      # linuxdeploy bundles its own "appimage" output plugin (no
      # separate appimagetool download needed); the gtk input plugin
      # is a separate script that has to be discoverable on PATH.
      # wxWidgets still links GTK/X11/etc. as dynamic system libraries
      # even though Conan builds everything else statically (see the
      # "Install system dependencies (Linux)" step above), so those
      # need bundling for the AppImage to run on a foreign distro.
      - name: Download linuxdeploy (Linux)
        if: runner.os == 'Linux'
        run: |
          curl -sL -o linuxdeploy.AppImage https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          curl -sL -o linuxdeploy-plugin-gtk.sh https://raw.githubusercontent.com/linuxdeploy/linuxdeploy-plugin-gtk/master/linuxdeploy-plugin-gtk.sh
          chmod +x linuxdeploy.AppImage linuxdeploy-plugin-gtk.sh

      - name: Build AppImage (Linux)
        if: runner.os == 'Linux'
        # AppImage tooling normally mounts itself via FUSE, which
        # isn't reliably present on the runner (newer Ubuntu dropped
        # libfuse2 by default); extract-and-run instead.
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          mkdir -p AppDir/usr/bin
          cp build/Release/aruspix AppDir/usr/bin/
          cp -r data/. AppDir/usr/bin/
          PATH="$PWD:$PATH" ./linuxdeploy.AppImage \
            --appdir AppDir \
            --executable AppDir/usr/bin/aruspix \
            --desktop-file linux/aruspix.desktop \
            --icon-file data/logo.png \
            --icon-filename aruspix \
            --plugin gtk \
            --output appimage

      - uses: actions/upload-artifact@v4
        if: runner.os == 'Linux'
        with:
          name: aruspix-AppImage-${{ runner.arch }}
          path: Aruspix*.AppImage
          if-no-files-found: error
          retention-days: 14

      # cmake --build alone doesn't run install() rules, so the bundle
      # in build/Release/ has no data/ or icon yet (see CMakeLists.txt)
      # -- install to a clean prefix to materialize the full bundle
      # before zipping it.
      - name: Package app bundle (macOS)
        if: runner.os == 'macOS'
        run: cmake --install build/Release --prefix appdir

      - name: Zip app bundle (macOS)
        if: runner.os == 'macOS'
        working-directory: appdir
        run: ditto -c -k --sequesterRsrc --keepParent Aruspix.app ../Aruspix-macOS.zip

      - uses: actions/upload-artifact@v4
        if: runner.os == 'macOS'
        with:
          name: aruspix-app-${{ runner.arch }}
          path: Aruspix-macOS.zip
          if-no-files-found: error
          retention-days: 14

  license-drift:
    # data/THIRD_PARTY_LICENSES.txt and src/app/axthirdparty_generated.h
    # are generated from the Conan dependency graph (see
    # tools/generate_third_party_notices.py). This job regenerates them
    # and fails if that changes anything, which means conanfile.py's
    # requirements moved without someone rerunning the script and
    # committing the result. `conan graph info` only resolves the
    # dependency graph, and the script covers all three shipped
    # platforms from its own settings overrides, so this runs once on
    # Linux rather than in the OS build matrix.
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Conan
        run: pip install --upgrade "conan>=2.0,<3"

      - name: Cache Conan packages
        uses: actions/cache@v4
        with:
          path: ~/.conan2
          key: conan-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('conanfile.py', 'recipes/**/conanfile.py') }}
          restore-keys: |
            conan-${{ runner.os }}-${{ runner.arch }}-

      - name: Detect Conan profile
        run: conan profile detect --force

      - name: Regenerate third-party notices
        run: python3 tools/generate_third_party_notices.py

      - name: Fail on drift
        run: |
          if ! git diff --quiet -- data/THIRD_PARTY_LICENSES.txt src/app/axthirdparty_generated.h; then
            echo "::error::data/THIRD_PARTY_LICENSES.txt and/or src/app/axthirdparty_generated.h are out of date with conanfile.py."
            echo "::error::Run 'python3 tools/generate_third_party_notices.py' locally and commit the result."
            git diff -- data/THIRD_PARTY_LICENSES.txt src/app/axthirdparty_generated.h
            exit 1
          fi
