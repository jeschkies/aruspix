name: Build

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      # wxWidgets, X11, OpenGL, and uuid are system libraries on Linux —
      # Conan does not provide them. Other platforms get everything from
      # Conan.
      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libgtk-3-dev \
            libgl1-mesa-dev \
            libglu1-mesa-dev \
            libuuid1 uuid-dev

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Conan
        run: pip install --upgrade "conan>=2.0,<3"

      - name: Detect Conan profile
        run: conan profile detect --force

      # Cache Conan downloads + binary packages. Key on the recipe files
      # so a change to the IM recipe or project requirements triggers a
      # rebuild; everyday source edits reuse cached binaries.
      - name: Cache Conan packages
        uses: actions/cache@v4
        with:
          path: ~/.conan2
          key: conan-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('conanfile.py', 'recipes/**/conanfile.py') }}
          restore-keys: |
            conan-${{ runner.os }}-${{ runner.arch }}-

      - name: Export local IM recipe
        run: conan export recipes/im

      - name: Install dependencies
        run: conan install . --build=missing

      - name: Configure
        run: cmake --preset conan-release

      - name: Build
        run: cmake --build build/Release -j

      - name: Verify binary
        run: |
          file build/Release/aruspix
          build/Release/aruspix --help || true

      - uses: actions/upload-artifact@v4
        with:
          name: aruspix-${{ runner.os }}-${{ runner.arch }}
          path: build/Release/aruspix
          if-no-files-found: error
          retention-days: 14
